name: Sync Bangumi data

# 状态：已恢复自动同步（2026-10）
#
# 背景：本机网络对 Bangumi 系域名（api.bgm.tv / api.bangumi.pro / api.bangumi.one）存在 SNI 阻断，
#       浏览器端 dynamic 模式必然拉取失败，于是改用 GitHub 的服务器抓取并提交进仓库。
#
# 已验证：GitHub Runner 能正常访问 api.bgm.tv（探测返回 HTTP 200，DNS 解析正常）——
#         **这条路不需要翻墙**。UID 1288644 也已确认正确。
#         （首次运行拿到空数组，是因为当时该账号刚注册、收藏还是空的。）
#
# 触发方式：每天定时 + 改动本工作流/抓取脚本时自动重跑 + Actions 页面手动触发。

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）同步一次
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      user_id:
        description: "Bangumi 用户 ID（留空则用仓库里的默认值）"
        required: false
        default: ""
  # 改动本工作流或抓取脚本时立即重跑一次（相当于手动「重新同步」的便捷入口）
  push:
    paths:
      - ".github/workflows/bangumi-sync.yml"
      - "scripts/fetch-bangumi.mjs"

permissions:
  contents: write

concurrency:
  group: bangumi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Bangumi collection
        run: node scripts/fetch-bangumi.mjs
        env:
          BANGUMI_USER_ID: ${{ inputs.user_id }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 注意：不要写成 git add <多个路径>——只要其中一个路径不存在，
          # git 会整体报错且什么都不暂存
          git add -A
          git status --short
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 同步 Bangumi 收藏数据"
            git push
          fi
