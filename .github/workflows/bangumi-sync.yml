name: Sync Bangumi data

# 为什么需要这个工作流：
#   本机网络对 Bangumi 系域名（api.bgm.tv / api.bangumi.pro / api.bangumi.one）存在 SNI 阻断，
#   浏览器端 dynamic 模式必然拉取失败。这里用 GitHub 的服务器定时抓取收藏数据，
#   提交进仓库后站点直接读本地 JSON（src/constants/bangumi-data.json）——**不需要任何代理/VPN**。
#
# 触发方式：每天定时 + 改动本工作流/抓取脚本时自动重跑 + Actions 页面手动触发。
# 失败排查：直接看 Actions 的运行日志（抓取脚本会打印探测结果与每个分类的进度）。

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）同步一次
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      user_id:
        description: "Bangumi 用户 ID（留空则用脚本里的默认值）"
        required: false
        default: ""
  # 改动本工作流或抓取脚本时立即重跑一次（相当于手动「重新同步」的便捷入口）
  push:
    paths:
      - ".github/workflows/bangumi-sync.yml"
      - "scripts/fetch-bangumi.mjs"

permissions:
  contents: write

# 同一时间只跑一个，避免并发提交冲突
concurrency:
  group: bangumi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Bangumi collection
        run: node scripts/fetch-bangumi.mjs
        env:
          BANGUMI_USER_ID: ${{ inputs.user_id }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只提交数据文件。
          # 注意：不要写成 git add <多个路径>——只要其中一个路径不存在，
          # git 会整体报错且什么都不暂存。诊断文件（含时间戳）不进仓库，
          # 否则每次运行都会产生一次无意义提交。
          git add src/constants/bangumi-data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 同步 Bangumi 收藏数据"
            git push
          fi
