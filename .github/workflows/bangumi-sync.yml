name: Sync Bangumi data

# 为什么需要这个工作流：
#   本机网络对 Bangumi 系域名（api.bgm.tv / api.bangumi.pro / api.bangumi.one）存在 SNI 阻断，
#   浏览器端 dynamic 模式必然拉取失败。这里用 GitHub 的服务器定时抓取收藏数据，
#   提交进仓库后站点直接读本地 JSON（src/constants/bangumi-data.json），无需任何代理。
#
# 诊断：脚本输出与网络探测结果会写入 ci-diagnostics/ 并提交回仓库，
#       这样在无法查看 Actions 日志时也能排查问题。

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）同步一次
    - cron: "17 3 * * *"
  # 支持在 Actions 页面手动触发
  workflow_dispatch:
  push:
    # 本工作流或抓取脚本变更时立刻跑一次；
    # 注意：数据文件与诊断目录的提交不在 paths 里，避免“提交 → 触发 → 再提交”的循环
    paths:
      - ".github/workflows/bangumi-sync.yml"
      - "scripts/fetch-bangumi.mjs"

# 允许工作流把抓取结果提交回仓库
permissions:
  contents: write

# 同一时间只跑一个，避免并发提交冲突
concurrency:
  group: bangumi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Bangumi collection
        id: fetch
        # 抓取失败时不要直接中断，先让后面的步骤把诊断信息提交回仓库
        continue-on-error: true
        run: |
          mkdir -p ci-diagnostics
          set +e
          node scripts/fetch-bangumi.mjs > ci-diagnostics/fetch-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> ci-diagnostics/fetch-output.txt
          echo "脚本退出码: $code"
          exit $code

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p ci-diagnostics
          UA="573787954-blog/1.0 (https://github.com/573787954/Firefly)"
          {
            echo "fetch step outcome: ${{ steps.fetch.outcome }}"
            echo "runner: $(uname -a)"
            echo "node: $(node --version)"
            echo
            echo "--- DNS: api.bgm.tv ---"
            getent hosts api.bgm.tv || echo "(getent 无结果)"
            echo
            echo "--- DNS: api.bangumi.one ---"
            getent hosts api.bangumi.one || echo "(getent 无结果)"
            echo
            echo "--- curl 官方接口 ---"
            curl -sS -m 25 -o /dev/null -w "http_code=%{http_code} time=%{time_total}s\n" \
              -A "573787954-blog/1.0 (https://github.com/573787954/Firefly)" \
              https://api.bgm.tv/v0/subjects/8 || echo "curl 失败，退出码 $?"
            echo
            echo "--- 用户是否存在: GET /v0/users/1288644 ---"
            curl -sS -m 25 -A "$UA" -o /tmp/dsh-user.json -w "http_code=%{http_code}\n" \
              https://api.bgm.tv/v0/users/1288644 || echo "curl 失败，退出码 $?"
            head -c 400 /tmp/dsh-user.json; echo
            echo
            echo "--- 收藏原始响应: GET /v0/users/1288644/collections?subject_type=2&limit=3 ---"
            curl -sS -m 25 -A "$UA" -o /tmp/dsh-col.json -w "http_code=%{http_code}\n" \
              "https://api.bgm.tv/v0/users/1288644/collections?subject_type=2&limit=3&offset=0" || echo "curl 失败，退出码 $?"
            head -c 600 /tmp/dsh-col.json; echo
            echo
            echo "--- 生成的文件 ---"
            ls -la src/constants/ 2>&1 || true
          } > ci-diagnostics/network-probe.txt 2>&1

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 注意：不要写成 git add <多个路径>——只要其中一个路径不存在，
          # git 会整体报错且什么都不暂存（配合 || true 会静默跳过提交）
          git add -A
          git status --short
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 同步 Bangumi 收藏数据"
            git push
          fi

      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "抓取失败，详见 ci-diagnostics/ 与 src/constants/bangumi-sync-status.json"
          exit 1
